<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avellvis - Acceso Administrativo</title>
    <style>
      :root {
        --bg-deep: #080808;
        --bg-surface: #121212;
        --bg-card: #181818;
        --text-main: #f4f4f0;
        --text-muted: #999999;
        --gold-primary: #d4af37;
        --gold-light: #f3e5ab;
        --border-gold: rgba(212, 175, 55, 0.3);
        --error: #e05c5c;
        --success: #4caf82;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        background-color: var(--bg-deep);
        color: var(--text-main);
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(24, 24, 24, 0.8) 0%, var(--bg-deep) 60%),
          var(--bg-deep);
      }

      .login-card {
        width: 100%;
        max-width: 400px;
        background: linear-gradient(145deg, #161616 0%, #0d0d0d 100%);
        border: 1px solid var(--border-gold);
        border-radius: 16px;
        padding: 40px 32px;
        box-shadow:
          0 20px 50px rgba(0, 0, 0, 0.6),
          0 0 25px rgba(212, 175, 55, 0.08);
      }

      .brand {
        display: block;
        text-align: center;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 6px;
        text-transform: uppercase;
        background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-primary) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 6px;
        text-decoration: none;
      }

      .subtitle {
        text-align: center;
        font-size: 11px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 32px;
      }

      .field {
        margin-bottom: 18px;
      }

      label {
        display: block;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--text-muted);
        margin-bottom: 8px;
      }

      input {
        width: 100%;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 13px 14px;
        color: var(--text-main);
        font-size: 14px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.3s, box-shadow 0.3s;
      }

      input:focus {
        border-color: var(--gold-primary);
        box-shadow: 0 0 12px rgba(212, 175, 55, 0.25);
      }

      .btn-login {
        width: 100%;
        margin-top: 10px;
        padding: 14px;
        border: none;
        border-radius: 30px;
        font-family: inherit;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--bg-deep);
        background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-primary) 100%);
        cursor: pointer;
        transition: transform 0.3s, box-shadow 0.3s;
      }

      .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 22px rgba(212, 175, 55, 0.45);
      }

      .msg {
        display: none;
        margin-bottom: 18px;
        padding: 12px 14px;
        border-radius: 8px;
        font-size: 12px;
        letter-spacing: 0.5px;
      }

      .msg.error {
        display: block;
        background: rgba(224, 92, 92, 0.12);
        border: 1px solid rgba(224, 92, 92, 0.4);
        color: var(--error);
      }

      .msg.success {
        display: block;
        background: rgba(76, 175, 130, 0.12);
        border: 1px solid rgba(76, 175, 130, 0.4);
        color: var(--success);
      }

      .back-link {
        display: block;
        text-align: center;
        margin-top: 22px;
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text-muted);
        text-decoration: none;
        transition: color 0.3s;
      }

      .back-link:hover {
        color: var(--gold-primary);
      }
    </style>
  </head>
  <body>
    <form class="login-card" id="login-form" novalidate>
      <a href="index.html" class="brand">Avellvis</a>
      <p class="subtitle">Panel de Administración</p>

      <div class="msg" id="msg"></div>

      <div class="field">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" autocomplete="username" required />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>

      <button type="submit" class="btn-login">Iniciar Sesión</button>

      <a href="index.html" class="back-link">← Volver a la tienda</a>
    </form>

    <script>
      const USERS_KEY = "avellvis_users";
      const SESSION_KEY = "avellvis_session";

      function seedUsers() {
        if (!localStorage.getItem(USERS_KEY)) {
          localStorage.setItem(
            USERS_KEY,
            JSON.stringify([{ username: "admin", password: "avellvis2026", fullName: "Administrador" }]),
          );
        }
      }
      seedUsers();

      if (localStorage.getItem(SESSION_KEY)) {
        window.location.replace("dashboard.html");
      }

      const msg = document.getElementById("msg");

      document.getElementById("login-form").addEventListener("submit", (e) => {
        e.preventDefault();
        msg.className = "msg";

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        if (!username || !password) {
          msg.className = "msg error";
          msg.textContent = "Completa usuario y contraseña.";
          return;
        }

        const users = JSON.parse(localStorage.getItem(USERS_KEY) || "[]");
        const user = users.find((u) => u.username === username && u.password === password);

        if (!user) {
          msg.className = "msg error";
          msg.textContent = "Usuario o contraseña incorrectos.";
          return;
        }

        localStorage.setItem(
          SESSION_KEY,
          JSON.stringify({ username: user.username, fullName: user.fullName, loginAt: new Date().toISOString() }),
        );
        msg.className = "msg success";
        msg.textContent = "Bienvenido, " + user.fullName + ". Redirigiendo...";
        setTimeout(() => window.location.replace("dashboard.html"), 600);
      });
    </script>
  </body>
</html>
