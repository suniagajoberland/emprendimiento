        --bg-deep: #080808;
        --bg-surface: #121212;
        --bg-card: #181818;
        --text-main: #f4f4f0;
        --text-muted: #999999;
        --gold-primary: #d4af37;
        --gold-light: #f3e5ab;
        --gold-dark: #aa820a;
        --accent-glow: rgba(212, 175, 55, 0.15);
        --border-gold: rgba(212, 175, 55, 0.3);
        --whatsapp-green: #25d366;
      }

      body {
        font-family: "Helvetica Neue", "Cinzel", Arial, sans-serif;
        background-color: var(--bg-deep);
        color: var(--text-main);
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      html {
        overflow-x: hidden;
        max-width: 100%;
      }

      /* --- BARRA DE NAVEGACIÓN --- */
      .navbar {
        background-color: rgba(18, 18, 18, 0.85);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border-gold);
        position: sticky;
        top: 0;
        z-index: 1000;
        padding: 16px clamp(16px, 4vw, 50px);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: nowrap;
        max-width: 100%;
      }

      .nav-brand {
        font-size: clamp(16px, 4vw, 20px);
        font-weight: 700;
        letter-spacing: clamp(2px, 1vw, 4px);
        text-transform: uppercase;
        color: var(--gold-light);
        text-decoration: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        background: linear-gradient(
          135deg,
          var(--gold-light) 0%,
          var(--gold-primary) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .nav-contact {
        font-size: clamp(10px, 2.5vw, 12px);
        font-weight: 600;
        color: var(--bg-deep);
        background: linear-gradient(
          135deg,
          var(--gold-light) 0%,
          var(--gold-primary) 100%
        );
        text-decoration: none;
        letter-spacing: 2px;
        padding: 10px clamp(14px, 4vw, 22px);
        border-radius: 30px;
        white-space: nowrap;
        flex-shrink: 0;
        transition:

          box-shadow 0.3s;

      .nav-contact:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
      }

      .nav-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }

      .nav-admin {
        font-size: clamp(9px, 2.2vw, 11px);
        font-weight: 600;
        color: var(--gold-primary);
        text-decoration: none;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 9px clamp(12px, 3vw, 18px);
        border: 1px solid var(--border-gold);
        border-radius: 30px;
        white-space: nowrap;
        transition: all 0.3s;
      }

      .nav-admin:hover {
        color: var(--gold-light);
        box-shadow: 0 0 16px rgba(212, 175, 55, 0.35);
      }

      /* --- CONTENEDOR PRINCIPAL --- */
      .main-container {
        max-width: 100%;
        margin: 0 auto;
        padding: clamp(30px, 6vw, 50px) 0;
        overflow-x: hidden;
      }

      .section-header {
        margin-bottom: 20px;
        text-align: center;
        padding: 0 clamp(16px, 5vw, 20px);
      }

      .section-title {
        font-size: clamp(22px, 7vw, 32px);
        font-weight: 300;
        letter-spacing: clamp(2px, 1vw, 4px);
        margin-bottom: 12px;
        color: var(--text-main);
        text-transform: uppercase;
      }

      .section-title span {
        color: var(--gold-primary);
        font-weight: 600;
      }

      .section-subtitle {
        font-size: 12px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 3px;
      }

      /* --- FILTRO DE CATEGORÍAS --- */
      .category-filter {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        max-width: 1400px;
        margin: 0 auto 10px auto;
        padding: 0 20px;
      }

      .filter-btn {
        font-family: inherit;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--text-muted);
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 30px;
        padding: 10px 22px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .filter-btn:hover {
        color: var(--gold-primary);
        border-color: var(--border-gold);
      }

      .filter-btn.active {
        color: var(--bg-deep);
        background: linear-gradient(
          135deg,
          var(--gold-light) 0%,
          var(--gold-primary) 100%
        );
        border-color: var(--gold-primary);
        box-shadow: 0 0 18px rgba(212, 175, 55, 0.35);
      }

      /* --- GRID DE PRODUCTOS --- */
      .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr));
        gap: 40px;
        justify-items: center;
        max-width: 1400px;
        width: 100%;
        margin: 0 auto;
        padding: 40px clamp(16px, 4vw, 40px) 60px;
        box-sizing: border-box;
        background: radial-gradient(
          circle at top,
          rgba(24, 24, 24, 0.6) 0%,
          var(--bg-deep) 100%
        );
      }

      .grid-empty {
        grid-column: 1 / -1;
        text-align: center;
        color: var(--text-muted);
        font-size: 13px;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 60px 20px;
      }

      /* --- TARJETAS PREMIUM CON EFECTO FLIP 3D --- */
      .product-card {
        background-color: transparent;
        width: 100%;
        max-width: 300px;
        height: 520px;
        perspective: 1200px;
        cursor: pointer;
        flex-shrink: 0;
        transition: transform 0.4s ease;
      }

      .product-card:hover {
        transform: translateY(-8px);
      }

      .card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        text-align: left;
        transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        transform-style: preserve-3d;
        box-shadow:
          0 15px 35px rgba(0, 0, 0, 0.5),
          0 0 15px rgba(212, 175, 55, 0.05);
        border-radius: 16px;
      }

      .product-card.flipped .card-inner {
        transform: rotateY(180deg);
      }

      .card-front,
      .card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 16px;
        background-color: var(--bg-card);
        overflow: hidden;
        border: 1px solid var(--border-gold);
        display: flex;
        flex-direction: column;
      }

      .card-back {
        transform: rotateY(180deg);
        padding: 22px;
        box-sizing: border-box;
        justify-content: space-between;
        background: linear-gradient(145deg, #161616 0%, #0d0d0d 100%);
      }

      .card-image-wrapper {
        position: relative;
        width: 100%;
        height: 250px;
        overflow: hidden;
        background-color: #0d0d0d;
      }

      .card-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition:
          opacity 0.4s ease,
          transform 0.6s ease;
      }

      .product-card:hover .card-image {
        transform: scale(1.05);
      }

      .card-image-wrapper::after {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 50%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.1),
          transparent
        );
        transform: skewX(-25deg);
        transition: 0.7s;
      }

      .product-card:hover .card-image-wrapper::after {
        left: 125%;
      }

      .card-info-front {
        padding: 16px 20px 18px;
        background: linear-gradient(
          to top,
          var(--bg-card),
          rgba(24, 24, 24, 0.9)
        );

        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--gold-primary);
        margin-bottom: 6px;
        font-weight: 600;

        margin: 0 0 8px 0;

        letter-spacing: 0.5px;

        font-weight: 700;
        color: var(--gold-light);
        letter-spacing: 1px;
        margin-bottom: 12px;

      /* --- SELECTORES (AHORA EN EL FRENTE) --- */

        margin-bottom: 12px;
      }

      .selector-seccion:last-child {

        font-weight: 600;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 6px;
        display: block;
        letter-spacing: 1px;

        height: 24px;
        border-radius: 50%;

        cursor: pointer;
        transition:

        background: transparent;
        cursor: pointer;

        color: var(--bg-deep);
        border-color: var(--gold-primary);
        box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);

        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 2px;

      }

      .back-preview-wrapper {
        width: 100%;
        height: 150px;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--border-gold);
        margin-bottom: 14px;
        background-color: #0d0d0d;
      }

      .back-preview {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: opacity 0.4s ease;

      .resumen {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .resumen-fila {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
      }

      .resumen-label {
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-muted);
        font-weight: 600;
        font-size: 10px;
      }

      .resumen-valor {
        color: var(--text-main);
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .resumen-swatch {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.25);
        display: inline-block;

        justify-content: center;

        color: #ffffff;
        text-decoration: none;
        padding: 12px;

        letter-spacing: 1.5px;
        transition: all 0.3s ease;

        width: 100%;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
      }

      .btn-whatsapp:hover {
        opacity: 0.95;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(37, 211, 102, 0.5);
      }
    </style>

      function mapearParaTienda(guardados) {
        return guardados
          .filter((p) => p.active)
          .map((p) => {
            const colores =
              p.colores && p.colores.length
                ? p.colores.map((c, i) => ({
                    nombre: c.nombre || "Color",
                    hex: c.hex || "#111111",
                    img: c.img || (i === 0 ? p.imagen || "" : ""),
                  }))
                : [{ nombre: "Negro Ébano", hex: "#111111", img: p.imagen || "" }];
            if (p.imagen && !colores.some((c) => c.img)) colores[0].img = p.imagen;
            return {
              nombre: p.nombre,
              modelo: p.sku || "S/N",
              precio: "$" + Number(p.precio || 0).toFixed(2),
              categoria: p.categoria || p.filtro,
              edicion: p.edicion || "Edición estándar",
              tallas: p.tallas && p.tallas.length ? p.tallas : ["Única"],
              colores,
              filtro: p.filtro,
            };
          });
      }

      function listaPorDefecto() {
        const lista = [];
        Object.keys(productosDefault).forEach((filtro) => {
          productosDefault[filtro].forEach((producto) => {
            lista.push({ ...producto, filtro });
          });
        });
        return lista;

        filtroActual = filtro;

          el.classList.toggle("active", el.dataset.filtro === filtro),

        renderProductos(filtro);

      filtros.forEach((el) => {

          event.preventDefault();
          aplicarFiltro(el.dataset.filtro);

      async function initTienda() {
        try {
          const { products, source } = await window.AvellvisDB.list();
          productosConFiltro = products.length
            ? mapearParaTienda(products)
            : listaPorDefecto();
          if (source === "sheet") {
            console.info("Avellvis: productos cargados desde Google Sheets.");
          }
        } catch {
          productosConFiltro = listaPorDefecto();
        }
        renderProductos(filtroActual);
      }

      initTienda();

      function crearTarjeta(producto) {
        const colorInicial = producto.colores[0];
        const tallaInicial = producto.tallas[0];

        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
          <div class="card-inner">
            <div class="card-front">
              <div class="card-image-wrapper">
                <img class="card-image" src="${colorInicial.img}" alt="${producto.nombre}" />
              </div>
              <div class="card-info-front">
                <div class="categoria">${producto.categoria}</div>
                <h3 class="nombre-producto">${producto.nombre}</h3>
                <div class="precio">${producto.precio}</div>
                <div class="selector-seccion">
                  <span class="selector-label">Talla:</span>
                  <div class="talla-selector">
                    ${producto.tallas
                      .map(
                        (t, i) =>
                          `<button class="talla-option${i === 0 ? " selected" : ""}">${t}</button>`,
                      )
                      .join("")}
                  </div>
                </div>
                <div class="selector-seccion">
                  <span class="selector-label">Gama de Color:</span>
                  <div class="color-selector">
                    ${producto.colores
                      .map(
                        (c, i) =>
                          `<div class="color-option${i === 0 ? " selected" : ""}" style="background-color:${c.hex}" title="${c.nombre}"></div>`,
                      )
                      .join("")}
                  </div>
                </div>
              </div>
            </div>
            <div class="card-back">
              <div>
                <div class="back-title">Resumen del Pedido</div>
                <div class="detalles-lista">
                  <p><strong>Edición:</strong> ${producto.edicion}</p>
                </div>
                <div class="back-preview-wrapper">
                  <img class="back-preview" src="${colorInicial.img}" alt="${producto.nombre}" />
                </div>
                <div class="resumen">
                  <div class="resumen-fila">
                    <span class="resumen-label">Color</span>
                    <span class="resumen-valor">
                      <span class="resumen-swatch" style="background-color:${colorInicial.hex}"></span>
                      <span class="resumen-color-nombre">${colorInicial.nombre}</span>
                    </span>
                  </div>
                  <div class="resumen-fila">
                    <span class="resumen-label">Talla</span>
                    <span class="resumen-valor resumen-talla">${tallaInicial}</span>
                  </div>
                </div>
              </div>
              <button class="btn-whatsapp">Adquirir por WhatsApp</button>
            </div>
          </div>
        `;

        const colorOpts = card.querySelectorAll(".color-option");
        const tallaOpts = card.querySelectorAll(".talla-option");
        const imgFront = card.querySelector(".card-image");
        const imgBack = card.querySelector(".back-preview");
        const swatch = card.querySelector(".resumen-swatch");
        const colorNombre = card.querySelector(".resumen-color-nombre");
        const tallaResumen = card.querySelector(".resumen-talla");

        function aplicarColor(index) {
          colorOpts.forEach((o, i) => o.classList.toggle("selected", i === index));
          const color = producto.colores[index];
          imgFront.style.opacity = "0.2";
          setTimeout(() => {
            imgFront.src = color.img;
            imgFront.style.opacity = "1";
          }, 200);
          imgBack.src = color.img;
          swatch.style.backgroundColor = color.hex;
          colorNombre.textContent = color.nombre;
        }

        function aplicarTalla(index) {
          tallaOpts.forEach((o, i) => o.classList.toggle("selected", i === index));
          tallaResumen.textContent = producto.tallas[index];
        }

        colorOpts.forEach((opt, index) => {
          opt.addEventListener("click", () => aplicarColor(index));
        });

        tallaOpts.forEach((opt, index) => {
          opt.addEventListener("click", () => aplicarTalla(index));
        });

        card.addEventListener("click", (event) => {
          if (
            event.target.closest(".color-option") ||
            event.target.closest(".talla-option") ||
            event.target.closest(".btn-whatsapp")
          ) {
            return;
          }
          card.classList.toggle("flipped");
        });

        card.querySelector(".btn-whatsapp").addEventListener("click", () => {
          const colorSeleccionado = colorNombre.textContent;
          const tallaSeleccionada = tallaResumen.textContent;
          const mensaje = `Hola, deseo concretar la adquisición exclusiva:\n\n*Prenda:* ${producto.nombre}\n*Modelo:* ${producto.modelo}\n*Talla:* ${tallaSeleccionada}\n*Gama Color:* ${colorSeleccionado}\n*Inversión:* ${producto.precio}`;
          const url = `https://wa.me/${TELEFONO}?text=${encodeURIComponent(mensaje)}`;
          window.open(url, "_blank");

          setTimeout(() => {
            aplicarColor(0);
            aplicarTalla(0);
            card.classList.remove("flipped");
          }, 1000);
        });

        return card;
      }

      function renderProductos(filtro) {
        grid.innerHTML = "";
        const lista =
          filtro === "todos"
            ? productosConFiltro
            : productosConFiltro.filter((p) => p.filtro === filtro);

        if (lista.length === 0) {
          const vacio = document.createElement("div");
          vacio.className = "grid-empty";
          vacio.textContent = "Próximamente nuevas piezas";
          grid.appendChild(vacio);
          return;
        }

        lista.forEach((producto) => grid.appendChild(crearTarjeta(producto)));
      }
    </script>
  </body>
</html>
